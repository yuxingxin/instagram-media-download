name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag matches app version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          TAURI="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          CARGO="$(awk -F '"' '/^version = / {print $2; exit}' src-tauri/Cargo.toml)"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$TAURI" ] || [ "$TAG" != "$CARGO" ]; then
            echo "Tag v${TAG} does not match package.json (${PKG}), tauri.conf.json (${TAURI}), or Cargo.toml (${CARGO})"
            exit 1
          fi

      - name: Generate release notes
        run: bash scripts/generate-release-notes.sh "${{ github.ref_name }}" release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          TITLE="Ins Downloader ${TAG}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "$TITLE" --notes-file release-notes.md --verify-tag
          fi
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --prerelease
          fi

  release:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            triple: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            args: ""
          - platform: windows-latest
            triple: x86_64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    env:
      INSTALOADER_TARGET: ${{ matrix.triple }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: ${{ matrix.triple }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Vendor instaloader runtime
        run: bash scripts/vendor-instaloader.sh "${{ matrix.triple }}"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALOADER_TARGET: ${{ matrix.triple }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Ins Downloader ${{ github.ref_name }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: false
          args: ${{ matrix.args }}
